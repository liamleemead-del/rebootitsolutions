# Netlify configuration for Reboot IT Solutions

[build]
  # No build command needed for static HTML
  publish = "."
  functions = "netlify/functions"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Redirects for clean URLs (optional)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/what-i-do"
  to = "/services.html"
  status = 301

# Note: Netlify automatically handles 404s - no catch-all redirect needed
# Form submissions require POST to work without redirect interference
